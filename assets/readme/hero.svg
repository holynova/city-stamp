<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">城市印记 City Stamp — 城市漫步徽章打卡档案</title>
  <desc id="desc">深色档案馆风标题：城市印记，副标题把走过的地方，收进会发光的六边形徽章；右侧三枚六边形徽章，上海已点亮呈青色辉光，北京呈金色，苏州未点亮呈灰阶。</desc>

  <g id="bg">
    <rect width="1200" height="360" rx="26" fill="#0d111a"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#00f0ff">城市漫步打卡 · CITY WALK CHECK-IN ARCHIVE</text>
    <text x="56" y="130" font-size="62" font-weight="700" fill="#f8fafc">城市印记</text>
    <text x="56" y="172" font-size="23" fill="#ffb800">CITY STAMP — 把走过的地方，收进会发光的徽章</text>
    <text x="56" y="208" font-size="19" fill="#94a3b8">上海、苏州、北京、杭州四城地标，点击点亮，记录到访时间。</text>
    <g id="chips" font-size="18" fill="#e7edf3" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#131e27" stroke="#2d3c49" stroke-width="1.5"/><text x="119" y="262">4 座城市</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#131e27" stroke="#2d3c49" stroke-width="1.5"/><text x="257" y="262">40 枚徽章</text></g>
      <g><rect x="332" y="238" width="150" height="36" rx="18" fill="#131e27" stroke="#2d3c49" stroke-width="1.5"/><text x="407" y="262">打卡时间戳</text></g>
      <g><rect x="494" y="238" width="126" height="36" rx="18" fill="#131e27" stroke="#2d3c49" stroke-width="1.5"/><text x="557" y="262">分享卡片</text></g>
    </g>
  </g>

  <g id="hex-badges" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <g id="hex-beijing">
      <polygon points="790,62 858,101 858,179 790,218 722,179 722,101" fill="#141821" stroke="#ffb800" stroke-width="3"/>
      <text x="790" y="128" font-size="20" font-weight="700" fill="#ffb800">北京</text>
      <text x="790" y="154" font-size="15" letter-spacing="2" fill="#94a3b8">BEIJING</text>
      <text x="790" y="180" font-size="15" fill="#ffb800">● 已点亮</text>
    </g>
    <g id="hex-shanghai">
      <polygon points="980,132 1048,171 1048,249 980,288 912,249 912,171" fill="#0e2430" stroke="#00f0ff" stroke-width="3"/>
      <text x="980" y="198" font-size="20" font-weight="700" fill="#00f0ff">上海</text>
      <text x="980" y="224" font-size="15" letter-spacing="2" fill="#94a3b8">SHANGHAI</text>
      <text x="980" y="250" font-size="15" fill="#00f0ff">● 已点亮 10/10</text>
    </g>
    <g id="hex-suzhou">
      <polygon points="790,235 838,263 838,318 790,345 742,318 742,263" fill="#141821" stroke="#5b6675" stroke-width="2.5"/>
      <text x="790" y="288" font-size="18" font-weight="700" fill="#8d9aaa">苏州</text>
      <text x="790" y="312" font-size="13" letter-spacing="2" fill="#8d9aaa">SUZHOU</text>
    </g>
    <g id="hex-hangzhou">
      <polygon points="1100,62 1142,86 1142,134 1100,158 1058,134 1058,86" fill="#141821" stroke="#5b6675" stroke-width="2.5"/>
      <text x="1100" y="104" font-size="16" font-weight="700" fill="#8d9aaa">杭州</text>
      <text x="1100" y="126" font-size="12" letter-spacing="1" fill="#8d9aaa">HANGZHOU</text>
    </g>
  </g>
</svg>
